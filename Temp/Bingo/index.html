<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>賓果卡生成器｜A4 六組列印版</title>
<style>
  :root{
    --ink:#111;
    --muted:#6b7280;
    --line:#d1d5db;
    --panel:#fff;
    --bg:#f3f4f6;
    --accent:#111827;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:var(--bg);
  }
  .toolbar{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:12px 16px;
    box-shadow:0 2px 12px rgba(0,0,0,.06);
  }
  .toolbar-inner{
    max-width:1180px;
    margin:auto;
    display:flex;
    flex-wrap:wrap;
    gap:10px 14px;
    align-items:end;
  }
  .brand{margin-right:auto;min-width:220px}
  .brand h1{font-size:20px;margin:0 0 3px;font-weight:800;letter-spacing:.04em}
  .brand p{margin:0;color:var(--muted);font-size:12px}
  .control{display:flex;flex-direction:column;gap:5px}
  .control label{font-size:12px;color:#4b5563;font-weight:700}
  .control input{
    width:82px;
    height:38px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    padding:0 10px;
    background:#fff;
    font-size:15px;
  }
  button{
    height:38px;
    padding:0 15px;
    border:1px solid #111827;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    background:#fff;
    color:#111827;
  }
  button.primary{background:#111827;color:white}
  button:hover{filter:brightness(.96)}
  .workspace{padding:24px 12px 42px}
  .page{
    width:210mm;
    min-height:297mm;
    margin:0 auto 24px;
    background:white;
    box-shadow:0 8px 28px rgba(0,0,0,.12);
    padding:0;
    display:grid;
    grid-template-columns:repeat(2, 105mm);
    grid-template-rows:repeat(3, 99mm);
    gap:0;
    page-break-after:always;
  }
  .page:last-child{page-break-after:auto}
  .card{
    position:relative;
    border:0;
    border-radius:0;
    padding:3mm 5mm 3mm;
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    overflow:hidden;
  }

  .card:nth-child(odd){border-right:0.35mm dashed #777;}
  .card:nth-child(-n+4){border-bottom:0.35mm dashed #777;}

  .card-head{
    position:relative;
    height:8mm;
    flex:0 0 8mm;
    margin:0 0 0.8mm;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* Left and right items are anchored independently so the title always stays centered. */
  .rank-field{
    position:absolute;
    left:0;
    top:0;
    height:7mm;
    width:30mm;
    color:#222;
    font-size:3.25mm;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:1mm;
    white-space:nowrap;
  }
  .card-no{
    position:absolute;
    right:0;
    top:0;
    min-width:21mm;
    height:7mm;
    padding:0 2.5mm;
    border:0.35mm solid #555;
    border-radius:3.5mm;
    background:#fff;
    color:#111;
    font-size:3.35mm;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
  }

  /* BINGO + image is one centered unit with a fixed-height image window. */
  .title-group{
    height:7mm;
    max-width:42mm;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1.2mm;
    white-space:nowrap;
    transform:rotate(-1deg);
  }
  .card-title{
    text-align:center;
    font-weight:900;
    font-family:"Arial Rounded MT Bold","Comic Sans MS","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:4.35mm;
    line-height:1;
    letter-spacing:0.12mm;
    color:#333;
    white-space:nowrap;
    text-shadow:0.18mm 0 #fff,-0.18mm 0 #fff,0 0.18mm #fff,0 -0.18mm #fff;
  }
  .title-image-box{
  width:12mm;
  height:8mm;
  overflow:visible;
  flex:0 0 12mm;
  display:flex;
  align-items:center;
  justify-content:center;
}
  .title-image{
  display:block;
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  object-position:center;
}

  .write-field{
    display:inline-flex;
    align-items:flex-end;
    gap:1mm;
  }
  .write-line{
    display:inline-block;
    width:13mm;
    height:4.3mm;
    border-bottom:0.35mm solid #555;
  }
  .write-line.name{width:20mm;}
  .grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:1mm 1.45mm;
    align-items:center;
    justify-items:center;
    min-height:0;
  }
  .ball{
    width:min(100%, 12.2mm);
    aspect-ratio:1/1;
    border:0.4mm solid #111;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:4.1mm;
    font-weight:850;
    line-height:1;
  }
  .note{
    max-width:1180px;
    margin:0 auto 16px;
    color:#6b7280;
    font-size:13px;
    text-align:center;
  }
  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}
    .toolbar,.note{display:none!important}
    .workspace{padding:0}
    .page{
      margin:0;
      width:210mm;
      height:297mm;
      min-height:297mm;
      padding:0;
      box-shadow:none;
      overflow:hidden;
    }
    .card{
      break-inside:avoid;
      border-radius:0;
    }
    .card:nth-child(odd){border-right:0.35mm dashed #777;}
    .card:nth-child(-n+4){border-bottom:0.35mm dashed #777;}
  }
  @media screen and (max-width:900px){
    .workspace{overflow:auto}
    .page{transform-origin:top left}
  }


</style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-inner">
      <div class="brand">
        <h1>賓果卡生成器</h1>
        <p>A4 直式・六等分無廢料・每頁 6 張・5×5 數字賓果卡</p>
      </div>
      <div class="control">
        <label for="pages">頁數</label>
        <input id="pages" type="number" min="1" max="50" value="1" />
      </div>
      <div class="control">
        <label for="minNum">最小數字</label>
        <input id="minNum" type="number" value="1" />
      </div>
      <div class="control">
        <label for="maxNum">最大數字</label>
        <input id="maxNum" type="number" value="75" />
      </div>
      <button id="regen" class="primary">重新生成</button>
      <button id="print">列印 A4</button>
    </div>
  </header>

  <main class="workspace">
    <div class="note">預設每張卡從 1–75 隨機抽取 25 個不重複數字；每頁固定排版 2 欄 × 3 列，共 6 張。</div>
    <div id="pagesRoot"></div>
  </main>

<script>
(function(){
  const root = document.getElementById('pagesRoot');
  const pageInput = document.getElementById('pages');
  const minInput = document.getElementById('minNum');
  const maxInput = document.getElementById('maxNum');

  function randomSample(min,max,count){
    const pool=[];
    for(let n=min;n<=max;n++) pool.push(n);
    if(pool.length<count) throw new Error(`數字範圍至少需要 ${count} 個不同數字。`);
    for(let i=pool.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]];
    }
    return pool.slice(0,count);
  }

  function makeCard(cardNumber,min,max){
    const card=document.createElement('section');
    card.className='card';

    const head=document.createElement('div');
    head.className='card-head';
    head.innerHTML=`
      <div class="title-group">
        <div class="card-title">BINGO</div>
        <span class="title-image-box"><img class="title-image" src="image.png" alt="" onerror="this.parentElement.style.display='none'"></span>
      </div>
      <div class="rank-field">
        <span class="write-field">名次<span class="write-line"></span></span>
      </div>
      <div class="card-no">No. ${String(cardNumber).padStart(3,'0')}</div>
    `;

    const grid=document.createElement('div');
    grid.className='grid';
    randomSample(min,max,25).forEach(n=>{
      const ball=document.createElement('div');
      ball.className='ball';
      ball.textContent=n;
      grid.appendChild(ball);
    });

    card.append(head,grid);
    return card;
  }

  function generate(){
    const pages=Math.max(1,Math.min(50,parseInt(pageInput.value)||1));
    const min=parseInt(minInput.value);
    const max=parseInt(maxInput.value);
    if(!Number.isFinite(min)||!Number.isFinite(max)||max<min){
      alert('請確認數字範圍設定正確。');
      return;
    }
    if(max-min+1<25){
      alert('每張卡需要 25 個不重複數字，因此數字範圍至少要包含 25 個數字。');
      return;
    }

    root.innerHTML='';
    let cardNo=1;
    for(let p=0;p<pages;p++){
      const page=document.createElement('div');
      page.className='page';
      for(let i=0;i<6;i++) page.appendChild(makeCard(cardNo++,min,max));
      root.appendChild(page);
    }
  }

  document.getElementById('regen').addEventListener('click',generate);
  document.getElementById('print').addEventListener('click',()=>window.print());
  [pageInput,minInput,maxInput].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')generate()}));

  generate();
})();
</script>
</body>
</html>
